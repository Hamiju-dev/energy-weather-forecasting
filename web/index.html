<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="PV power forecasts from ECMWF IFS, ECMWF AIFS and NOAA GFS open data" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>ewf · PV forecast</title>
    <script>
      try {
        const t = localStorage.getItem("ewf-theme");
        if (t === "dark" || (!t && matchMedia("(prefers-color-scheme: dark)").matches)) document.documentElement.classList.add("dark");
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
